version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: memed-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - memed-network

  # Redis Cache Service
  redis:
    image: redis:7.2-alpine
    container_name: memed-redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - memed-network

  # Express TypeScript Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memed-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/memed_payouts
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=memed_docker_super_secret_key_2025
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - memed-network

  # Next.js TypeScript Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memed-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - PORT=3000
    depends_on:
      - backend
    networks:
      - memed-network

volumes:
  mongo_data:

networks:
  memed-network:
    driver: bridge
